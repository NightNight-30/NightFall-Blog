    <div class="footer-info">
      <div class="footer-row">
        <img class="footer-ico" src="/img/网站管理@2x.svg" alt=""/>
        <span>本站由 <a href="/">NightFall</a> 使用 <a href="https://github.com/xaoxuu/hexo-theme-stellar/tree/1.44.0">Stellar 1.44.0</a> 主题创建</span>
      </div>
      <div class="footer-row">
        <img class="footer-ico" src="/img/隐私保护.svg" alt=""/>
        <span>本博客所有文章除特别声明外，均采用 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener"><img class="footer-ico cc-license" src="https://licensebuttons.net/l/by-nc-sa/4.0/88x31.png" alt="CC BY-NC-SA 4.0"/></a> 许可协议，转载请注明出处</span>
      </div>
      <div class="footer-row footer-beian">
        <span class="beian-item">
          <img class="footer-ico" src="/img/工信部.svg" alt=""/>
          <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">沪ICP备2026031983号-1</a>
        </span>
        <span class="beian-sep">·</span>
        <span class="beian-item">
          <img class="footer-ico beian-police" src="/img/beian-police.png" alt="公安"/>
          <a href="http://www.beian.mps.gov.cn/" target="_blank" rel="noopener">沪公网安备31011302009443号</a>
        </span>
        <span class="beian-sep">·</span>
        <span class="beian-item">
          <img class="footer-ico beian-moe" src="/img/beian-moe.svg" alt="萌"/>
          <a href="https://icp.gov.moe/?keyword=20260810" target="_blank" rel="noopener">萌ICP备20260810号</a>
        </span>
      </div>
      <div class="footer-row">
        <img class="footer-ico" src="/img/时间.svg" alt=""/>

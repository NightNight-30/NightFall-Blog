open_graph:
  enable: true
  twitter_id: # for open_graph meta

# 外部文件注入（https://xaoxuu.com/wiki/stellar/advanced-settings/ §外部文件注入）
# head: 注入到 <head> 末尾；script: 注入到 <body> 末尾
inject:
  head:
    - <link rel="stylesheet" href="/css/code-enhance.css?v=20260904f">
    - <link rel="stylesheet" href="/css/leftbar-extras.css?v=20260903e">
  script:
    - <script src="/js/swiper-fancybox-group.js" defer></script>
    - <script src="/js/sidebar-talks.js?v=20260821b" defer></script>
    - <script src="/js/lunar.js?v=20260722c" defer></script>
    - <script src="/js/sidebar-calendar.js?v=20260722e" defer></script>
    - <script src="/js/theme-toggle.js?v=20260820i" defer></script>
    - <script src="/js/leftbar-order.js?v=20260903a" defer></script>
    - <script src="/js/leftbar-extras.js?v=20260903e" defer></script>
    - <script src="/js/pin-badge.js?v=20260903b" defer></script>
    - <script src="/js/typewriter.js?v=20260728a" defer></script>
    - <script src="/js/topic-card-link.js?v=20260904d" defer></script>

# SEO: Canonical 防备用站/盗站分散主站权重（https://xaoxuu.com/wiki/stellar/seo-settings/）
# originalHost 留空 → 功能完全关闭（不注入 canonical 标签、不弹任何提示）
# 部署上线时取消注释填生产域名即开启；非主站访问会弹「备用站/盗站」提示并加 noindex,nofollow
canonical:
  originalHost: nightfall7.top  # 生产主站域名（必须全小写，浏览器 host 自动小写，大写不匹配会弹盗站提示）
  officialHosts: # 备用站主机列表，主站部署后访问这些地址会显示「备用站」提示而非「盗站」警告
    - localhost

style:
  prefers_theme: dark # auto / light / dark（默认深色模式）
  # 1.36.0 起移除 style.smooth_scroll（滚动体验统一由 JS 控制）
  font-size:
    # 1.43.0 起移除 font-size.body：正文与组件字号统一从 root 派生。
    # 原来 root:16px + body:17px，为保留原正文 17px 观感，root 取 17px
    root: 17px # 改这个会影响全局所有文字的字号（移动端会自动 +2px）
    code: 85% # 相较于其所在行的文本大小，建议用百分比
    codeblock: 0.8125rem # 13px
  font-family:
    body: '"Noto Serif SC", system-ui, "Microsoft Yahei", "Segoe UI", Arial, sans-serif'
    code: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'
    codeblock: 'Menlo, Monaco, Consolas, system-ui, monospace, sans-serif'
  text-align: left
  prefix:
    h2: https://api.iconify.design/ci:heading-h2.svg
  border-radius:
    card-l: 24px # 侧边栏、文章横幅位置的圆角
    card: 16px # 文章内大部分卡片的圆角
    card-s: 12px # 文章内小型卡片的圆角
    bar: 8px # 横条类元素的圆角
    image-l: 24px # 非技术类文章插图圆角
    image: 16px # 技术类文章插图圆角
    image-s: 8px # 评论区图片圆角（部分评论支持）
  color:
    # 主题色配置（不会根据明暗动态调整，请设置为通用的颜色）
    theme: 'hsl(150 32% 40%)' # 主题色（松绿，呼应雪顶雾山背景）
    accent: 'hsl(150 35% 32%)' # 强调色（B方案：与主题色同族松绿）
    link: 'hsl(155 40% 28%)' # 超链接颜色（B方案：深松绿保证白底对比度）
  animated_avatar:
    animate: auto # auto, always
    # 1.39.0 起移除 animated_avatar.background，头像光环改用 style.gradient.avatar
  codeblock:
    scrollbar: 4px
    highlightjs_theme: https://gcore.jsdelivr.net/gh/highlightjs/cdn-release@11.9/build/styles/atom-one-dark.min.css
  loading:
    loading: 正在加载
    error: 加载失败，请稍后重试。
  gradient: # https://webgradients.com/
    start: 'linear-gradient(to right, hsl(160, 30%, 55%), hsl(140, 28%, 50%), hsl(100, 26%, 50%), hsl(100, 26%, 50%), hsl(140, 28%, 50%), hsl(160, 30%, 55%))'
    # B方案：彩虹占位图换纯色松绿（1.39.0 起头像光环渐变移到这个键）
    avatar: 'conic-gradient(from 0deg, hsl(150 25% 50%), hsl(150 25% 50%))'
  leftbar:
    # 1.39.0 起纯色背景按明暗拆成两个键（旧 background-color 已废弃）
    background-color-light: var(--card) # var(--block)
    background-color-dark: var(--card) # var(--block)
    # B方案：去掉彩虹占位背景图，纯色 card 底
    # background-image: url(https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg)
    blur-px: 100px
    blur-bg: var(--bg-a60)
    background-opacity: 0.8
  # 1.39.0 起移除 style.paginator.prev/next（分页器图标改内置 SVG）
  error_page: https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.12/404/1c830bfcd517d.svg
  site: # 使用 background-image 后，blur 设置才有效
    # B方案：去掉山景照片（糊满全屏是「没特点」的头号来源），改纯色+点阵+等高线（见 code-enhance.css）
    # background-image: url(/img/site-bg-mountains.jpg)
    blur-px: 100px
    blur-bg: var(--bg-a75)
    blur-sat: 300%
  # 技术文章内页各级标题前面的符号
  header_prefix:
    h2: '#'
    h3: '='
    h4: '|'
    h5: ':'

# 站点页面布局配置
site_tree:
  home:
    leftbar: welcome, recent
    rightbar: calendar, recent_talks
  post:
    leftbar: welcome, related, recent
    rightbar: toc
  page:
    leftbar: welcome, recent
    rightbar: toc
  # 笔记本列表页
  notebooks:
    base_dir: notebooks
    menu_id: notebooks
    leftbar: welcome, recent
    rightbar: null
  # 笔记列表页
  notes:
    menu_id: notebooks
    leftbar: welcome, tagtree, recent
    rightbar: null
  # 笔记内页
  note:
    leftbar: welcome, tagtree, recent
    rightbar: toc

# 笔记本全局配置
notebook:
  # 自动摘要长度
  auto_excerpt: 128
  # 每页显示多少条笔记，0 表示不分页
  per_page: 20
  # 笔记排序方式，默认按更新时间降序
  order_by: -updated
  # 是否在笔记页面显示许可协议
  license: false
  # 是否在笔记页面显示分享按钮
  share: false
  # 标签图标（tagtree widget 用，key 区分大小写，'' 是所有未匹配标签的默认图标）
  # 注意：必须配在这里，配在笔记本 yml 的 tagicons 字段无效（源码只读 theme.notebook.tagcons）
  tagcons:
    '': solar:hashtag-square-bold
    # tech 标签
    'Git': fab:git-alt
    'JavaScript': fab:js
    'Python': fab:python
    'Vue': fab:vuejs
    'React': fab:react
    'CSS': fab:css3-alt
    'Node.js': fab:node-js
    'Docker': fab:docker
    '前端': solar:code-bold-duotone
    '工具': solar:settings-bold-duotone
    # book 标签
    '小说': solar:notebook-bold-duotone
    '心理学': solar:heart-pulse-bold-duotone
    '经济学': solar:chart-bold-duotone
    '科技': solar:rocket-bold-duotone
    '自我成长': solar:rocket-bold-duotone

# tech: 默认技术类文章, story: 图文类文章，文字和段落间增距大
article:
  type: tech # tech/story
  # 1.44 默认 pin_style: carousel（置顶文章变顶部轮播大卡，跑到 navbar 上面且更宽）；
  # flat = 不渲染轮播，置顶文章回首页列表靠前展示，对齐线上 1.33.1
  pin_style: flat
  # 1.44 默认 hero（全图封面大卡，会跑到 navbar 上面且更宽）；线上 1.33.1 是普通卡片，改回 classic 对齐
  card_style: classic

# 设置鼠标指上 subtitle 后翻转另一行字(导航title下的文字)
logo:
  subtitle: '岂能尽如人意 | 但求无愧我心'
  avatar: '[{config.avatar}](/about/)' # you can set avatar link in _config.yml or '[https://xxx.png](/about/)'
  title: '[{config.title}](/)' # you can set html tag like: '[<img no-lazy height="32px" src="xxx"/>](/)'


# 侧边栏主功能导航菜单
menubar:
  columns: 5 # 一行多少个
  items: # 可按照自己需求增加，符合以下格式即可
    - id: post # 页面中高亮的 menu_id
      theme: '#E91E63' # 高亮时的颜色，仅 svg 中 fill="currentColor" 时有效
      icon: solar:chat-square-like-bold-duotone # 支持 svg/img 标签，可以定义在 icons.yml 文件中，也支持外部图片的 URL
      title: 博客 # 标题
      url: / # 跳转链接，支持相对路径和绝对路径
    - id: life
      theme: '#FFC107'
      icon: solar:camera-bold-duotone
      title: 生活
      url: /life/
    - id: friends
      theme: '#6366F1'
      icon: solar:planet-bold-duotone
      title: 友链
      url: /friends/
    - id: shuoshuo
      theme: '#00BFA5'
      icon: solar:balloon-bold-duotone
      title: 说说
      url: /shuoshuo/
    - id: about
      theme: '#6D28D9'
      icon: solar:user-bold-duotone
      title: 关于
      url: /about/

# 文章搜索
search:
  service: local_search # local_search, todo...
  local_search:
    field: all # post, page, all
    path: /search.json # 搜索文件存放位置
    content: true # 是否搜索内容
    skip_search: [] # 指定 path 中的内容不被搜索。
    codeblock: true # 是否搜索代码块（需要content: true)

# 评论
comments:
  service: artalk
  comment_title: 快来参与讨论吧~
  # 1.36.0 起移除 comments.lazyload；artalk 图片弹窗 1.44.0 起内置（with-fancybox）
  artalk:
    css: https://cdn.jsdelivr.net/npm/artalk@2.9/dist/Artalk.css
    js: https://cdn.jsdelivr.net/npm/artalk@2.9/dist/Artalk.js
    server: https://api.nightfall7.top/artalk
    site: 'NightFall'
    darkMode: auto

# 页脚
footer:
  social:
    github:
      icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder/social/08a41b181ce68.svg"/>'
      url: https://github.com/NightNight-30
    gitee:
      icon: '<img src="https://api.iconify.design/simple-icons:gitee.svg?color=%23c71d23"/>'
      url: https://gitee.com/slient_7
    music:
      icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder/social/3845874.svg"/>'
      url: https://music.163.com/#/user/home?id=91356672
    rss:
      icon: '<img src="https://api.iconify.design/fa6-solid:rss.svg?color=%23ff7a00"/>'
      url: /atom.xml
    # TODO: 配置留言板后取消注释（填入站内路径如 /comments/ 或外部链接）
    # comments:
    #   icon: '<img src="https://gcore.jsdelivr.net/gh/cdn-x/placeholder/social/942ebbf1a4b91.svg"/>'
    #   url: /comments/
  # 底部站点地图：三组导航链接，提升导航 + SEO
  sitemap:
    - title: 博客
      items:
        - '[近期发布](/)'
        - '[专栏](/topic/)'
        - '[标签](/tags/)'
        - '[归档](/archives/)'
    - title: 导航
      items:
        - '[生活](/life/)'
        - '[友链](/friends/)'
        - '[说说](/shuoshuo/)'
        - '[关于](/about/)'
    - title: 协议
